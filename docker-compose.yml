services:
  postgres:
    image: postgres:17

    container_name: postgres-course

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: coursedb

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    # Проверка "база готова принимать подключения".
    # Благодаря ей работает: docker compose up -d --wait
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coursedb"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
